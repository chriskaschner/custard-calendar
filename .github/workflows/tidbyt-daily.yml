name: Tidbyt Daily Push

on:
  schedule:
    # 6 AM Central (UTC-6) = noon UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      - name: Install pixlet
        run: |
          PIXLET_TAG=$(gh release view --repo tidbyt/pixlet --json tagName -q .tagName)
          PIXLET_VER=${PIXLET_TAG#v}
          curl -LO "https://github.com/tidbyt/pixlet/releases/download/${PIXLET_TAG}/pixlet_${PIXLET_VER}_linux_amd64.tar.gz"
          tar -xzf "pixlet_${PIXLET_VER}_linux_amd64.tar.gz"
          sudo mv pixlet /usr/local/bin/
          pixlet version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Write config
        run: |
          cat > config.yaml << 'EOF'
          stores:
            - slug: "mt-horeb"
              brand: "culvers"
              name: "Mt. Horeb"
              role: "primary"
            - slug: "madison-todd-drive"
              brand: "culvers"
              name: "Madison Todd Dr"
              role: "secondary"
          worker_base: "https://custard.chriskaschner.com"
          tidbyt:
            device_id: "${{ secrets.TIDBYT_DEVICE_ID }}"
            installation_id: "culvers"
            view_mode: "three_day"
            brand: "culvers"
          EOF

      - name: Fetch flavor data
        run: uv run python main.py --fetch-only

      - name: Render and push to Tidbyt
        env:
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
        run: uv run python main.py --tidbyt-only

      # Tells the Worker this job is alive. operator-alerts.js emails when a
      # heartbeat goes overdue -- this workflow was auto-disabled for repo
      # inactivity in Jun 2026 and nothing noticed for five weeks.
      #
      # always(): the heartbeat means "this workflow still fires", not "the push
      # succeeded". A failed push already sends a GitHub failure email; silence
      # does not, which is the gap this closes.
      - name: Heartbeat
        if: always()
        env:
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $WORKER_API_TOKEN" \
            https://custard.chriskaschner.com/api/heartbeat/tidbyt_daily
