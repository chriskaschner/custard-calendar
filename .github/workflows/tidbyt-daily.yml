name: Tidbyt Daily Push

on:
  schedule:
    # 6 AM Central (UTC-6) = noon UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      - name: Install pixlet
        run: |
          PIXLET_TAG=$(gh release view --repo tidbyt/pixlet --json tagName -q .tagName)
          PIXLET_VER=${PIXLET_TAG#v}
          curl -LO "https://github.com/tidbyt/pixlet/releases/download/${PIXLET_TAG}/pixlet_${PIXLET_VER}_linux_amd64.tar.gz"
          tar -xzf "pixlet_${PIXLET_VER}_linux_amd64.tar.gz"
          sudo mv pixlet /usr/local/bin/
          pixlet version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Write config
        run: |
          cat > config.yaml << 'EOF'
          stores:
            - slug: "mt-horeb"
              brand: "culvers"
              name: "Mt. Horeb"
              role: "primary"
            - slug: "madison-todd-drive"
              brand: "culvers"
              name: "Madison Todd Dr"
              role: "secondary"
          worker_base: "https://custard.chriskaschner.com"
          tidbyt:
            device_id: "${{ secrets.TIDBYT_DEVICE_ID }}"
            installation_id: "culvers"
            view_mode: "three_day"
            brand: "culvers"
          EOF

      - name: Fetch flavor data
        run: uv run python main.py --fetch-only

      - name: Render and push to Tidbyt
        env:
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
        run: uv run python main.py --tidbyt-only

      # Dead man's switch. This workflow was auto-disabled for repo inactivity
      # in Jun 2026 and nothing noticed for five weeks. UptimeRobot alerts when
      # this ping stops arriving.
      #
      # Deliberately NOT if: always() -- the ping only fires on a successful
      # push, so "no successful push in N days" is what gets monitored. With a
      # ~2 day threshold on a daily job, one transient failure is absorbed but a
      # persistently broken push still alerts. That is strictly more than
      # liveness, and it costs nothing.
      #
      # Monitored externally on purpose: an in-Worker check could not detect a
      # Cloudflare outage or the Worker's own cron dying.
      - name: Heartbeat
        env:
          HEARTBEAT_URL: ${{ secrets.UPTIMEROBOT_HEARTBEAT_TIDBYT }}
        run: |
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "::warning::UPTIMEROBOT_HEARTBEAT_TIDBYT is not set; skipping heartbeat."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 "$HEARTBEAT_URL"
