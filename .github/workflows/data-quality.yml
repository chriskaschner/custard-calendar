name: Data Quality Gate

on:
  schedule:
    # Run weekly, Sunday 2 AM Central (8 AM UTC)
    - cron: '0 8 * * 0'
  workflow_dispatch:

jobs:
  backfill-coverage:
    name: D1 Backfill Coverage Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node / wrangler
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler
        working-directory: worker

      - name: Check D1 backfill coverage (priority stores)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run python scripts/check_backfill_coverage.py --stores mt-horeb,verona,madison-todd-drive --min-pct 90
        # Exits nonzero if any priority store is below 90% D1/local coverage.
        # Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
        # Culver's only -- it diffs D1 against the local Wayback backfill corpus,
        # which does not exist for the Milwaukee brands. Those are covered by the
        # freshness gate below.

      - name: Check brand fetch freshness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run python scripts/check_brand_freshness.py
        # Fails if any brand has recorded nothing in 4+ days. This is the check
        # that was missing when Oscar's went dark for five months and Gille's for
        # weeks: the priority-store list above is three Culver's stores, so no
        # Milwaukee brand was watched by anything.

  metrics-seed-freshness:
    name: Metrics Seed Freshness Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      - name: Check metrics seed data age (<= 45 days)
        continue-on-error: true
        run: uv run python scripts/check_metrics_seed_freshness.py

  heartbeat:
    name: Heartbeat
    runs-on: ubuntu-latest
    # Dead man's switch, monitored by UptimeRobot. This workflow was
    # auto-disabled for repo inactivity in Jun 2026 and ran for five weeks
    # without anyone noticing.
    #
    # Depends on both gates and does NOT use if: always(), so the ping means
    # "the gates passed". On a weekly job with a ~9 day threshold that means a
    # single failing run alerts -- which is wanted here, since a data-quality
    # gate that stays red for a week is a real problem, not noise.
    #
    # Monitored externally on purpose: an in-Worker check could not detect a
    # Cloudflare outage or the Worker's own cron dying.
    needs: [backfill-coverage, metrics-seed-freshness]
    steps:
      - name: Ping UptimeRobot
        env:
          HEARTBEAT_URL: ${{ secrets.UPTIMEROBOT_HEARTBEAT_DATA_QUALITY }}
        run: |
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "::warning::UPTIMEROBOT_HEARTBEAT_DATA_QUALITY is not set; skipping heartbeat."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 "$HEARTBEAT_URL"
