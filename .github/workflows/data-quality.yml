name: Data Quality Gate

on:
  schedule:
    # Run weekly, Sunday 2 AM Central (8 AM UTC)
    - cron: '0 8 * * 0'
  workflow_dispatch:

jobs:
  backfill-coverage:
    name: D1 Backfill Coverage Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node / wrangler
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler
        working-directory: worker

      - name: Check D1 backfill coverage (priority stores)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run python scripts/check_backfill_coverage.py --stores mt-horeb,verona,madison-todd-drive --min-pct 90
        # Exits nonzero if any priority store is below 90% D1/local coverage.
        # Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.

  metrics-seed-freshness:
    name: Metrics Seed Freshness Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      - name: Check metrics seed data age (<= 45 days)
        continue-on-error: true
        run: uv run python scripts/check_metrics_seed_freshness.py

  heartbeat:
    name: Heartbeat
    runs-on: ubuntu-latest
    needs: [backfill-coverage, metrics-seed-freshness]
    # always(): the heartbeat means "this workflow still fires", NOT "its gates
    # passed". A failing gate already surfaces via GitHub's failure email;
    # silence does not, which is the gap this closes. Gating the ping on gate
    # success would report a red gate as a dead workflow.
    if: always()
    steps:
      - name: Ping Worker
        env:
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $WORKER_API_TOKEN" \
            https://custard.chriskaschner.com/api/heartbeat/data_quality
